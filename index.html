<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUNA BEAUTY STUDIO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #fdf8f5;
      color: #4b3832;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      letter-spacing: 3px;
      margin-top: 30px;
      color: #8c6860;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 15px;
      letter-spacing: 1px;
      color: #9b8078;
    }

    .welcome {
      margin: 45px 0 30px;
      font-size: 22px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu button {
      width: 100%;
      padding: 18px;
      border: 1px solid #dbc9c2;
      border-radius: 14px;
      background: #fffaf8;
      color: #5a4039;
      font-family: Georgia, serif;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover {
      background: #f3e5df;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 45px;
      font-size: 12px;
      color: #aa938b;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      LUNA
    </div>

    <div class="subtitle">
      BEAUTY STUDIO
    </div>

    <div class="welcome">
      Welcome to your beauty assistant ✨
    </div>

    <div class="menu">

      <button onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSfjuKu7TTeKBCsMSEdsv9hqHq9fRa7JhNrQPLCEfOc8hzW-pA/viewform?usp=publish-editor')">
        💗 Κλείσε ραντεβού
      </button>

      <button onclick="alert('💅 Μανικιούρ — 30€\n🦶 Πεντικιούρ — 35€\n✨ Περιποίηση Προσώπου — 45€\n👁️ Extensions Βλεφαρίδων — 55€\n🤎 Σχηματισμός & Περιποίηση Φρυδιών — 30€\n💆‍♀️ Lash Lift — 40€\n💎 Gel / Ημιμόνιμο — 40€\n🌸 Luxury Facial — 60€')">
        ✨ Υπηρεσίες & Τιμές
      </button>

    <button onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSeZ3dTuj0ANox857-PALDBWBJ_21D-vf0PTT_MUybN2ghBajg/viewform?usp=publish-editor', '_blank')">
  ❌ Ακύρωση Ραντεβού
</button>

      <button onclick="lunaAssistant()">
  💬 Έχω μια ερώτηση
</button>

    </div>

    <div class="footer">
      Powered by ELåiVA — T&S COMPANY
    </div>

  </div>
<script>
function lunaAssistant() {
  const question = prompt("💗 Γεια σου! Είμαι η LUNA, η beauty assistant σου ✨\n\nΤι θα ήθελες να με ρωτήσεις;");

  if (!question) return;

  const q = question.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

  if (q.includes("ραντεβου") || q.includes("κλεισω") || q.includes("κρατηση")) {
    alert("💗 Φυσικά! Πάτησε «Κλείσε ραντεβού» για να συμπληρώσεις τη φόρμα κράτησης.");
  } 
  else if (q.includes("τιμη") || q.includes("τιμες") || q.includes("κοστιζει") || q.includes("κοστιζει") || q.includes("ποσο") || q.includes("κανει")) {
    
    if (q.includes("μανικιουρ")) {
      alert("💅 Το μανικιούρ μας κοστίζει 30€.");
    } 
    else if (q.includes("πεντικιουρ")) {
      alert("🦶 Το πεντικιούρ μας κοστίζει 35€.");
    } 
    else if (q.includes("βλεφαριδ")) {
      alert("👁️ Τα extensions βλεφαρίδων κοστίζουν 55€.");
    } 
    else if (q.includes("προσωπο") || q.includes("facial")) {
      alert("✨ Η περιποίηση προσώπου κοστίζει 45€.");
    }
    else {
      alert("✨ Πάτησε «Υπηρεσίες & Τιμές» για να δεις όλες τις υπηρεσίες μας.");
    }
  } 
  else if (q.includes("ακυρ")) {
    alert("❌ Για ακύρωση ραντεβού πάτησε «Ακύρωση Ραντεβού» και συμπλήρωσε τη φόρμα.");
  } 
  else if (q.includes("μανικιουρ")) {
    alert("💅 Το μανικιούρ μας κοστίζει 30€.");
  } 
  else if (q.includes("πεντικιουρ")) {
    alert("🦶 Το πεντικιούρ μας κοστίζει 35€.");
  } 
  else if (q.includes("βλεφαριδ")) {
    alert("👁️ Τα extensions βλεφαρίδων κοστίζουν 55€.");
  } 
  else {
    alert("✨ Ευχαριστώ για την ερώτησή σου! Για περισσότερες πληροφορίες μπορείς να επικοινωνήσεις μαζί μας.");
  }
}
</script>
</script>
</body>
</html>
