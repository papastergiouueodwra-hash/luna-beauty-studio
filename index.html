<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUNA BEAUTY STUDIO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, serif;
      background: #fdf8f5;
      color: #4b3832;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 40px 24px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      letter-spacing: 3px;
      margin-top: 30px;
      color: #8c6860;
    }

    .subtitle {
      margin-top: 10px;
      font-size: 15px;
      letter-spacing: 1px;
      color: #9b8078;
    }

    .welcome {
      margin: 45px 0 30px;
      font-size: 22px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .menu button {
      width: 100%;
      padding: 18px;
      border: 1px solid #dbc9c2;
      border-radius: 14px;
      background: #fffaf8;
      color: #5a4039;
      font-family: Georgia, serif;
      font-size: 17px;
      cursor: pointer;
      transition: 0.2s;
    }

    .menu button:hover {
      background: #f3e5df;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 45px;
      font-size: 12px;
      color: #aa938b;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      LUNA
    </div>

    <div class="subtitle">
      BEAUTY STUDIO
    </div>

    <div class="welcome">
      Welcome to your beauty assistant ✨
    </div>

    <div class="menu">

      <button onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSfjuKu7TTeKBCsMSEdsv9hqHq9fRa7JhNrQPLCEfOc8hzW-pA/viewform?usp=publish-editor)">
        💗 Κλείσε ραντεβού
      </button>

      <button onclick="alert('Υπηρεσίες & Τιμές')">
        ✨ Υπηρεσίες & Τιμές
      </button>

      <button onclick="alert('Ακύρωση Ραντεβού')">
        ❌ Ακύρωση Ραντεβού
      </button>

      <button onclick="alert('Έχω μια ερώτηση')">
        💬 Έχω μια ερώτηση
      </button>

    </div>

    <div class="footer">
      Powered by ELåiVA — T&S COMPANY
    </div>

  </div>

</body>
</html>
